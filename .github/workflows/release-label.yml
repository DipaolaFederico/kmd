# Tells, on every pull request, which release merging it will publish, and
# fails when the release labels contradict each other. See CONTRIBUTING.md,
# "Releases".
name: Release label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  label:
    name: Release label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          release=$(jq -r '[.[] | select(startswith("release:"))] | join(" ")' <<<"$LABELS")
          if [ "$(wc -w <<<"$release")" -gt 1 ]; then
            echo "::error::Use a single release label (found: $release)."
            exit 1
          fi
          case $release in
            release:major) msg="merging publishes a MAJOR release (X+1.0.0)" ;;
            release:minor) msg="merging publishes a minor release (X.Y+1.0)" ;;
            release:patch) msg="merging publishes a patch release (X.Y.Z+1)" ;;
            release:skip)  msg="merging publishes no release" ;;
            *)             msg="no release label: merging publishes a patch release (X.Y.Z+1); add release:minor, release:major or release:skip if that is not right" ;;
          esac
          echo "::notice::$msg"
          echo "### Release: $msg" >> "$GITHUB_STEP_SUMMARY"
