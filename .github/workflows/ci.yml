# Continuous integration: every push to main and every pull request must pass
# the same gates as the local `make ci` (minus the timing-sensitive perf gate,
# which is unreliable on shared runners — run it locally).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch newly published vulnerabilities

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failing command in a pipe fails the step

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: Formatting (gofmt -s)
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: staticcheck
        run: make staticcheck
      - name: No third-party dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "::error file=go.mod::kmd must stay dependency-free (standard library only)"
            exit 1
          fi

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: Tests (race detector)
        run: make test
      - name: CommonMark / GFM conformance
        run: make spec | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Coverage (minimum 90%)
        run: |
          make cover | tee cover.txt
          { echo '### Coverage'; echo '```'; go tool cover -func=coverage.out | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fuzz smoke test (10s per fuzzer)
        run: make fuzz FUZZ_TIME=10s

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: govulncheck (known vulnerabilities)
        run: make vuln
      - name: gosec (static security analysis)
        run: make gosec

  build:
    name: Build & packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: Install packaging validators
        run: sudo apt-get update -qq && sudo apt-get install -y -qq groff appstream
      - name: Build and validate packaging metadata
        run: make packaging
      - name: Cross-compile
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 freebsd/amd64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null . && echo "$t ok"
          done
