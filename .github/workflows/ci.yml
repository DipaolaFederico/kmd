# Continuous integration: every push to main and every pull request must pass
# the same gates as the local `make ci` (minus the timing-sensitive perf gate,
# which is unreliable on shared runners — run it locally).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch newly published vulnerabilities

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failing command in a pipe fails the step

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  GOTOOLCHAIN: local

jobs:
  # Changes that cannot affect kmd (README, contributing guide, templates,
  # the release and PR-convention workflows) skip the other jobs. They are
  # skipped rather than not started so the required checks still report
  # (GitHub counts a skipped job as passed). Unknown paths always run CI.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      project: ${{ steps.diff.outputs.project }}
      fuzz-packages: ${{ steps.fuzz.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List the packages with fuzzers (one runner each)
        id: fuzz
        run: echo "packages=$(make fuzz-list)" >> "$GITHUB_OUTPUT"
      - name: Does the change touch the project?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          range=""
          case $EVENT in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              # main: compare with the last release, not the previous push, so
              # a docs-only push never "passes" CI (and triggers a release)
              # on top of code whose CI failed or was cancelled
              last=$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
              [ "$REF_TYPE" = branch ] && [ -n "$last" ] && range="$last..$AFTER" ;;
          esac
          # --no-renames: a code file renamed to README.md lists the deleted file too
          if [ -z "$range" ] || ! files=$(git diff --no-renames --name-only "$range" 2>/dev/null); then
            echo "Full run ($EVENT)."
            echo "project=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files" | sed 's/^/  /'
          # a file turned into a symlink could pull runner files into a
          # release (modes from git, not from the names: 0 yes, 1 no, 2 error)
          status=0
          scripts/symlink-changed.sh "$range" || status=$?
          if [ "$status" != 1 ]; then
            echo "Symlink changed (or could not tell): full run."
            echo "project=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          outside='^((README|CONTRIBUTING|SECURITY)\.md|LICENSE|\.gitignore|docs/PACKAGING\.md|docs/images/([^/]+/)*[^/]+\.(md|png|gif|tape)|\.github/(ISSUE_TEMPLATE/.*|pull_request_template\.md|CODEOWNERS|dependabot\.yml|workflows/(release|pr-conventions|verify-packages)\.yml))$'
          if grep -qvE "$outside" <<<"$files"; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only files outside the project changed: skipping lint, tests, security and build."
            echo "project=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the complexity ratchet compares with the merge base
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: Formatting (gofmt -s)
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: Helper scripts
        run: make scripts-test
      - name: staticcheck
        run: make staticcheck
      - name: Complexity, duplication and dead code
        run: make complexity dupl deadcode STRICT=1
      - name: No third-party dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "::error file=go.mod::kmd must stay dependency-free (standard library only)"
            exit 1
          fi

  # Coverage runs without -race, so it also runs testlimit.Linear (the
  # quadratic check), which -race skips. The two runs, and the fuzzers of
  # each package, get their own runners so they run side by side; "Test &
  # coverage" (the required check) reports their combined result.
  race:
    name: Race tests & conformance
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: Tests (race detector)
        run: make test
      - name: CommonMark / GFM conformance
        run: make spec | tee -a "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: Coverage (minimum 90%)
        run: |
          make cover
          { echo '### Coverage'; echo '```'; go tool cover -func=coverage.out | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # one crashing fuzzer should not hide another
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.fuzz-packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # the shortest Go jobs would win the race to save the shared
          # cache, which would then hold one package's fuzz build instead
          # of the lint and security tools; a cold fuzz build costs about
          # what restoring the cache does
          cache: false
      - name: Fuzz smoke test (10s per fuzzer)
        env:
          PACKAGE: ${{ matrix.package }}
        run: make fuzz FUZZ="$PACKAGE/%" FUZZ_TIME=10s

  test-result:
    name: Test & coverage
    needs: [changes, race, coverage, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # skipped only counts when Changes chose to skip the project: a gate
      # skipped for any other reason must not pass the required check
      - name: Race tests, coverage and fuzzing passed (or were skipped)
        env:
          PROJECT: ${{ needs.changes.outputs.project }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success) ;;
              skipped) [ "$PROJECT" != true ] || exit 1 ;;
              *) exit 1 ;;
            esac
          done

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: govulncheck (known vulnerabilities)
        run: make vuln
      - name: gosec (static security analysis)
        run: make gosec

  build:
    name: Build & packaging
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: Install packaging validators
        run: sudo apt-get update -qq && sudo apt-get install -y -qq groff appstream ruby lintian python3-yaml
      - name: Build and validate packaging metadata, manifests and .deb
        run: make packaging STRICT=1
      - name: Cross-compile every released platform
        run: |
          for t in $(scripts/release-targets.sh); do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null . && echo "$t ok"
          done

  # The experimental AI (docs/experimental/ai.md) is not in the released
  # binary, but every pull request builds and tests it, so a change elsewhere
  # that breaks it fails in its own pull request, where the fix is small.
  # The gates of `make test-ai`, split across runners so they run side by
  # side; "Experimental AI (-tags kmdai)" (the required check) reports
  # their combined result.
  ai:
    name: AI ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # report every failing gate, not just the first
      matrix:
        include:
          - { name: build and lint, gates: build-ai vet staticcheck deadcode }
          - { name: race tests, gates: test }
          - { name: coverage, gates: cover }
          - { name: security, gates: security }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod # no go.sum: kmd has no dependencies
      - name: ${{ matrix.name }} (-tags kmdai)
        env:
          GATES: ${{ matrix.gates }}
        run: make $GATES GOTAGS=kmdai # unquoted: one make target per word

  ai-result:
    name: Experimental AI (-tags kmdai)
    needs: [changes, ai]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # skipped only counts when Changes chose to skip the project: a gate
      # skipped for any other reason must not pass the required check
      - name: Every AI gate passed (or was skipped)
        env:
          PROJECT: ${{ needs.changes.outputs.project }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success) ;;
              skipped) [ "$PROJECT" != true ] || exit 1 ;;
              *) exit 1 ;;
            esac
          done

  nix:
    name: Nix flake
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: nix flake check (builds kmd and runs its tests)
        run: nix flake check -L
      - name: nix run
        run: |
          nix run . -- --version
          echo "# ok" | nix run . -- -c never
          ls "$(nix build --no-link --print-out-paths)"/share/man/man1/kmd.1.gz
